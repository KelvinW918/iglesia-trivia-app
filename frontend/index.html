<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Devocionales y trivia de la iglesia">
    <meta name="theme-color" content="#0f172a">
    <title> CCRF Jehová Justicia Nuestra - Plataforma Devocional</title>

    <!-- Favicon (opcional, si tienes uno) -->
    <!-- <link rel="icon" href="/favicon.ico" type="image/x-icon"> -->

    <!-- Tailwind CSS (CDN de desarrollo — OK para hoy) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons (versión FIJA, no @latest) -->
    <script src="https://unpkg.com/lucide@0.469.0"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Soporte para notch/dynamic island de iPhone X+ en el nav sticky */
        .sticky.top-0 {
            padding-top: max(1rem, env(safe-area-inset-top));
        }

        /* iOS: inputs con font-size < 16px hacen zoom automático al enfocar.
           Forzamos 16px como mínimo en móviles para evitarlo. */
        @media (max-width: 768px) {

            input,
            select,
            textarea {
                font-size: 16px !important;
            }
        }

        /* Scroll suave cuando usamos scrollIntoView() desde JS */
        html {
            scroll-behavior: smooth;
        }

        /* Mejora el tap-highlight en iOS (evita el flash azul al tocar botones) */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Contenedor Dinámico de la Aplicación -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Spinner visible mientras cargan los scripts y despierta Render -->
        <div id="app-loading" class="flex-1 flex items-center justify-center">
            <div class="text-center space-y-4">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto"></div>
                <p class="text-slate-400 text-sm">Cargando plataforma...</p>
            </div>
        </div>
    </div>

    <!-- Fallback si JS está deshabilitado -->
    <noscript>
        <div class="p-8 text-center text-slate-400">
            Esta aplicación requiere JavaScript. Por favor actívalo en tu navegador.
        </div>
    </noscript>

    <!-- 1. Servicios base -->
    <script src="./js/api.js"></script>

    <!-- 2. Componentes de UI -->
    <script src="./js/components/rankingComponent.js"></script>
    <script src="./js/components/authComponent.js"></script>
    <script src="./js/components/memberComponent.js"></script>
    <script src="./js/components/pastorComponent.js"></script>

    <!-- 3. Orquestador (SIEMPRE al final) -->
    <script src="./js/app.js"></script>
</body>

</html>
