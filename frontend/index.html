<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma devocional CCRF Jehová Justicia Nuestra">
    <meta name="theme-color" content="#0f172a">
    <title>CCRF Jehová Justicia Nuestra · Plataforma Devocional</title>

    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png">
    <link rel="manifest" href="./img/site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.469.0"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .sticky.top-0 {
            padding-top: max(1rem, env(safe-area-inset-top));
        }

        @media (max-width: 768px) {

            input,
            select,
            textarea {
                font-size: 16px !important;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes logo-breathe {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.04);
                opacity: 0.92;
            }
        }

        .logo-loading {
            animation: logo-breathe 2.2s ease-in-out infinite;
        }

        /* ════════════════════════════════════════════════════════════
           TARJETA AUTH (login / registro / pastor)
           ════════════════════════════════════════════════════════════ */
        .auth-card {
            position: relative;
            background: linear-gradient(145deg,
                    rgba(30, 41, 59, 0.95) 0%,
                    rgba(15, 23, 42, 0.98) 100%);
            border: 1px solid rgba(51, 65, 85, 0.7);
            box-shadow:
                0 0 80px -20px rgba(99, 102, 241, 0.35),
                0 25px 50px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .auth-card.accent-emerald {
            box-shadow:
                0 0 80px -20px rgba(16, 185, 129, 0.35),
                0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .auth-card.accent-indigo-deep {
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow:
                0 0 90px -18px rgba(99, 102, 241, 0.45),
                0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }

        /* ════════════════════════════════════════════════════════════
           ESTRELLAS FUGACES (decorativo)
           ════════════════════════════════════════════════════════════ */
        .auth-stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .auth-star {
            position: absolute;
            top: 0;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.08),
                0 0 0 6px rgba(255, 255, 255, 0.04),
                0 0 15px rgba(255, 255, 255, 0.55);
            animation: auth-star-shoot 4s linear infinite;
            will-change: transform, opacity;
        }

        .auth-star::before {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 180px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.6), transparent);
        }

        @keyframes auth-star-shoot {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform: rotate(315deg) translateX(-700px);
                opacity: 0;
            }
        }

        .auth-star:nth-child(1) {
            top: 8%;
            right: 6%;
            animation-delay: 0s;
            animation-duration: 3.2s;
        }

        .auth-star:nth-child(2) {
            top: 22%;
            right: 18%;
            animation-delay: 1.4s;
            animation-duration: 4.0s;
        }

        .auth-star:nth-child(3) {
            top: 4%;
            right: 34%;
            animation-delay: 2.6s;
            animation-duration: 3.6s;
        }

        .auth-star:nth-child(4) {
            top: 45%;
            right: 12%;
            animation-delay: 3.4s;
            animation-duration: 5.0s;
        }

        /* Si el usuario prefiere menos movimiento, apagamos estrellas */
        @media (prefers-reduced-motion: reduce) {
            .auth-star {
                animation: none;
                opacity: 0;
            }

            .logo-loading {
                animation: none;
            }
        }

        /* ════════════════════════════════════════════════════════════
           BRILLO EN BOTÓN SUBMIT (hover)
           ════════════════════════════════════════════════════════════ */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }

        .btn-shine::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.28),
                    transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
            pointer-events: none;
        }

        .btn-shine:hover::before {
            left: 130%;
        }

        /* Logo glow suave en las tarjetas auth */
        .auth-logo {
            filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.35));
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

    <div id="app" class="flex-1 flex flex-col">
        <div id="app-loading" class="flex-1 flex items-center justify-center">
            <div class="text-center space-y-5">
                <img src="./img/logo.png" alt="CCRF Jehová Justicia Nuestra"
                    class="w-24 h-24 mx-auto object-contain logo-loading drop-shadow-lg">

                <div class="space-y-3">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-500 mx-auto"></div>
                    <p class="text-slate-400 text-sm">Cargando plataforma...</p>
                </div>
            </div>
        </div>
    </div>

    <noscript>
        <div class="p-8 text-center text-slate-400">
            Esta aplicación requiere JavaScript. Por favor actívalo en tu navegador.
        </div>
    </noscript>

    <script src="./js/api.js"></script>
    <script src="./js/components/rankingComponent.js"></script>
    <script src="./js/components/authComponent.js"></script>
    <script src="./js/components/memberComponent.js"></script>
    <script src="./js/components/pastorComponent.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
